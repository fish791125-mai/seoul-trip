<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d57"><title>Seoul Trip｜首爾五日遊</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#193446;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#173d57,#367a91);color:white;padding:24px 18px 20px}h1{font-size:27px;margin:0 0 5px}.sub{opacity:.85;font-size:13px}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.user{font-size:12px;max-width:155px;overflow-wrap:anywhere}button,.btn{border:0;background:#166f88;color:white;border-radius:12px;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}button.secondary{background:#e6eff3;color:#19516b}button.danger{background:#fbe9e9;color:#b13c3c}button:disabled{opacity:.5}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:white;padding:9px;position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #19344612}nav button{background:#f1f4f7;color:#526b7a;padding:12px 4px}nav button.active{background:#d6edf2;color:#115b73}main{padding:15px 13px 60px}.card{background:white;border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 3px 14px #1230460a}.card h3{margin:0 0 8px}.muted{color:#6d7f8c;font-size:13px}.pill{font-size:12px;background:#eaf3f5;color:#286378;padding:5px 8px;border-radius:30px}.line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.item{border-top:1px solid #edf1f4;padding:13px 0}.item:first-of-type{border-top:0}.item strong{display:block;margin-bottom:4px}.small{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{padding:7px 10px;font-size:12px}a{color:#086c91;text-decoration:none}input,select,textarea{width:100%;padding:12px;border:1px solid #cad6dc;border-radius:10px;background:white;font:inherit;font-size:15px}label{display:block;font-size:13px;font-weight:600;margin:11px 0 5px}textarea{min-height:75px}.form{background:#edf5f7;padding:14px;border-radius:14px;margin:12px 0}.form h3{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.days{display:flex;overflow:auto;gap:7px;padding:4px 0 7px}.days button{white-space:nowrap;background:#e6edf1;color:#34576a}.days button.active{background:#146f87;color:white}.empty{text-align:center;padding:30px 10px;color:#69808c}.notice{padding:12px;border-radius:12px;background:#fff5dc;color:#78521b;font-size:13px;margin:12px 0}.good{background:#e7f6ec;color:#24653c}.total{font-size:25px;font-weight:750;margin:8px 0}.check{width:auto;margin-right:7px}footer{padding:20px;text-align:center;color:#8997a0;font-size:12px}.hide{display:none!important}
</style></head><body><div class="wrap"><header><div class="top"><div><h1>🇰🇷 Seoul Trip</h1><div class="sub">2026.11.20 — 11.24｜四人共用旅行手帳</div></div><div class="user" id="user">尚未登入</div></div><div class="actions"><button id="login">Google 登入</button><button id="logout" class="secondary hide">登出</button></div></header><nav><button data-tab="trip" class="active">🗓 行程</button><button data-tab="shop">🛍 購物</button><button data-tab="cost">💰 記帳</button></nav><main><div id="status" class="notice">請先使用 Google 登入。只有已授權的旅伴可以同步修改。</div><section id="trip"><div class="days" id="days"></div><div id="tripList"></div><div id="tripForm" class="form hide"><h3 id="tripFormTitle">新增行程</h3><label>日期</label><select id="tDay"></select><label>時間（可留空）</label><input id="tTime" placeholder="例如 09:00"><label>行程名稱</label><input id="tName" placeholder="例如 景福宮韓服"><label>地點／地圖搜尋文字</label><input id="tPlace" placeholder="例如 景福宮 首爾"><label>備註</label><textarea id="tNote"></textarea><div class="actions"><button id="saveTrip">儲存</button><button class="secondary" id="cancelTrip">取消</button></div></div><button id="addTrip">＋ 新增行程</button></section><section id="shop" class="hide"><div class="card"><h3>🛍 購物清單</h3><div class="muted">依購買地點分類；價格以韓元 KRW 記錄</div><label>篩選購買地點</label><select id="shopFilter"><option value="">全部地點</option></select></div><div id="shopList"></div><div id="shopForm" class="form hide"><h3 id="shopFormTitle">新增商品</h3><label>商品名稱</label><input id="sName" placeholder="例如 白樺樹保濕面霜"><label>購買地點</label><select id="sStore"><option>Olive Young</option><option>大創 Daiso</option><option>樂天超市</option><option>廣藏市場</option><option>弘大</option><option>明洞</option><option>其他</option></select><label>預估／實際價格（韓元）</label><input id="sPrice" type="number" min="0" placeholder="0"><label>備註</label><input id="sNote" placeholder="例如 色號／數量"><div class="actions"><button id="saveShop">儲存</button><button class="secondary" id="cancelShop">取消</button></div></div><button id="addShop">＋ 新增商品</button></section><section id="cost" class="hide"><div class="card"><h3>💰 共同花費</h3><div class="muted">以韓元記帳；可記錄付款者與分攤人數</div><div class="total" id="costTotal">₩0</div><div class="muted" id="costSummary">尚無紀錄</div></div><div id="costList"></div><div id="costForm" class="form hide"><h3 id="costFormTitle">新增花費</h3><label>項目</label><input id="cName" placeholder="例如 計程車、晚餐、小費"><div class="grid"><div><label>金額（韓元）</label><input id="cAmount" type="number" min="0"></div><div><label>分攤人數</label><select id="cSplit"><option>4</option><option>3</option><option>2</option><option>1</option></select></div></div><label>付款者</label><input id="cPayer" placeholder="輸入旅伴暱稱"><label>日期</label><select id="cDay"></select><label>備註</label><input id="cNote" placeholder="可留空"><div class="actions"><button id="saveCost">儲存</button><button class="secondary" id="cancelCost">取消</button></div></div><button id="addCost">＋ 新增花費</button></section></main><footer>Seoul Trip · Firebase 即時同步 · 只有授權帳號可讀寫</footer></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCtp_0uvvLoBIVqXCKytt9QeG__05hvaco',authDomain:'seoul-cf9b4.firebaseapp.com',projectId:'seoul-cf9b4',storageBucket:'seoul-cf9b4.firebasestorage.app',messagingSenderId:'39933808097',appId:'1:39933808097:web:b5e3994a202a50548b16a0',measurementId:'G-VK30GKZNMP'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id),days=['11/20（五）','11/21（六）','11/22（日）','11/23（一）','11/24（二）'];let day=0,tab='trip',records={trip:[],shop:[],cost:[]},unsubs=[],editing={trip:null,shop:null,cost:null},user=null;
const seed=[
[0,'15:40','桃園機場起飛','桃園國際機場','抵達仁川 19:15'],[0,'20:55','機場快線 AREX','仁川國際機場第二航廈','前往首爾站'],[0,'','樂天超市','首爾站 樂天超市','抵達後採購'],
[1,'','大公園纜車','首爾大公園 纜車',''],[1,'','醬蟹','首爾 醬蟹','餐廳週日休息，安排週六'],[1,'','蠶室樂天','蠶室 樂天世界購物中心',''],
[2,'09:00','景福宮韓服','景福宮 首爾','拍照'],[2,'12:00','新村辣奶油排骨','新村 辣奶油排骨','午餐，時間可調整'],[2,'','弘大逛街','弘大 首爾','文具、睡衣；晚上自由安排'],
[3,'','廣藏市場','廣藏市場 首爾','買棉被'],[3,'12:00','三清燒肉（乙支店）','三清燒肉 乙支店','午餐，時間可調整'],[3,'18:30','特麗芙醫美','首爾 特麗芙 醫美','預約時間'],[3,'','明洞逛街','明洞 首爾',''],
[4,'07:20','首爾站機場快線','首爾站 AREX','前往仁川機場'],[4,'12:30','仁川機場起飛','仁川國際機場','14:20 抵達桃園']].map(([day,time,name,place,note],i)=>({id:'local'+i,day,time,name,place,note,seed:true}));
const seedShop=[['BIOHEAL BOH 雙面膜','Olive Young'],['膠原蛋白噴霧','Olive Young'],['celimax 視黃醛微針精華','Olive Young'],['ROUND LAB 防曬','Olive Young'],['ROUND LAB 白樺樹保濕面霜','Olive Young'],['高露潔美白牙膏','Olive Young'],['棉被','廣藏市場'],['文具','弘大'],['睡衣','弘大']].map(([name,store],i)=>({id:'sample'+i,name,store,price:0,note:'待確認價格',seed:true,bought:false}));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₩'+Number(n||0).toLocaleString('en-US')}function showStatus(s,ok=false){$('status').textContent=s;$('status').className='notice'+(ok?' good':'')}function canEdit(){if(!user){alert('請先登入 Google 帳號');return false}return true}function mapLink(place){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place)}function openForm(kind,id=null){if(!canEdit())return;editing[kind]=id;$(kind+'Form').classList.remove('hide');$(kind+'FormTitle').textContent=id?'編輯資料':'新增資料';let r=records[kind].find(x=>x.id===id)||{};if(kind==='trip'){if(r.seed){editing.trip=null;r={...r}}$('tDay').value=r.day??day;$('tTime').value=r.time||'';$('tName').value=r.name||'';$('tPlace').value=r.place||'';$('tNote').value=r.note||''}if(kind==='shop'){$('sName').value=r.name||'';$('sStore').value=r.store||'Olive Young';$('sPrice').value=r.price||'';$('sNote').value=r.note||''}if(kind==='cost'){$('cName').value=r.name||'';$('cAmount').value=r.amount||'';$('cSplit').value=r.split||'4';$('cPayer').value=r.payer||'';$('cDay').value=r.day??day;$('cNote').value=r.note||''}$(kind+'Form').scrollIntoView({behavior:'smooth',block:'center'})}
function closeForm(kind){$(kind+'Form').classList.add('hide');editing[kind]=null}async function save(kind,data){if(!canEdit())return;try{if(editing[kind])await updateDoc(doc(db,'seoul2026_'+kind,editing[kind]),data);else await addDoc(collection(db,'seoul2026_'+kind),{...data,createdAt:serverTimestamp()});closeForm(kind)}catch(e){alert('儲存失敗：'+e.message)}}async function remove(kind,id){if(!confirm('確定刪除這筆資料？'))return;try{await deleteDoc(doc(db,'seoul2026_'+kind,id))}catch(e){alert('刪除失敗：'+e.message)}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['trip','shop','cost'].forEach(x=>$(x).classList.toggle('hide',x!==tab));$('days').innerHTML=days.map((d,i)=>`<button class="${i===day?'active':''}" data-day="${i}">${d}</button>`).join('');let trips=[...seed,...records.trip].filter(x=>Number(x.day)===day).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));$('tripList').innerHTML=`<div class="card"><div class="line"><h3>${days[day]} 行程</h3><span class="pill">${trips.length} 項</span></div>${trips.map(r=>`<div class="item"><div class="line"><div><span class="pill">${esc(r.time||'彈性')}</span><strong style="margin-top:8px">${esc(r.name)}</strong><div class="muted">${esc(r.note||'')}</div></div><a target="_blank" rel="noopener" href="${mapLink(r.place||r.name)}">📍 地圖</a></div>${!r.seed?`<div class="actions"><button class="secondary" data-edit="trip:${r.id}">編輯</button><button class="danger" data-del="trip:${r.id}">刪除</button></div>`:'<div class="muted small">預設行程（可新增調整項目）</div>'}</div>`).join('')}</div>`;
let shops=[...seedShop,...records.shop],filter=$('shopFilter').value,stores=[...new Set(shops.map(s=>s.store))];$('shopFilter').innerHTML='<option value="">全部地點</option>'+stores.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('shopFilter').value=filter;shops=shops.filter(s=>!filter||s.store===filter);$('shopList').innerHTML=shops.length?stores.filter(s=>shops.some(x=>x.store===s)).map(store=>`<div class="card"><h3>${esc(store)}</h3>${shops.filter(x=>x.store===store).map(r=>`<div class="item"><div class="line"><div><strong>${r.seed?'▫️':r.bought?'✅':'⬜'} ${esc(r.name)}</strong><div class="muted">${money(r.price)} · ${esc(r.note||'')}</div></div>${!r.seed?`<button class="secondary" data-toggle="${r.id}">${r.bought?'取消勾選':'已購買'}</button>`:''}</div>${!r.seed?`<div class="actions"><button class="secondary" data-edit="shop:${r.id}">編輯</button><button class="danger" data-del="shop:${r.id}">刪除</button></div>`:''}</div>`).join('')}</div>`).join(''):'<div class="empty">尚無商品</div>';
let costs=[...records.cost].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));let sum=costs.reduce((a,c)=>a+Number(c.amount||0),0);$('costTotal').textContent=money(sum);$('costSummary').textContent=`${costs.length} 筆花費 · 依各筆分攤人數計算；未指定個別分攤對象`; $('costList').innerHTML=costs.length?costs.map(r=>`<div class="card"><div class="line"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(days[r.day]||'')} · ${esc(r.payer||'未填付款者')}</div><div class="muted">${esc(r.note||'')}</div></div><div style="text-align:right"><strong>${money(r.amount)}</strong><div class="muted">${r.split} 人分攤<br>每人 ${money(Number(r.amount||0)/Number(r.split||4))}</div></div></div><div class="actions"><button class="secondary" data-edit="cost:${r.id}">編輯</button><button class="danger" data-del="cost:${r.id}">刪除</button></div></div>`).join(''):'<div class="empty">尚未新增花費</div>'}
['tDay','cDay'].forEach(id=>$(id).innerHTML=days.map((d,i)=>`<option value="${i}">${d}</option>`).join(''));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('days').onclick=e=>{let b=e.target.closest('[data-day]');if(b){day=Number(b.dataset.day);render()}};$('shopFilter').onchange=render;
['trip','shop','cost'].forEach(kind=>{$('add'+kind[0].toUpperCase()+kind.slice(1)).onclick=()=>openForm(kind);$('cancel'+kind[0].toUpperCase()+kind.slice(1)).onclick=()=>closeForm(kind)});
$('saveTrip').onclick=()=>{let name=$('tName').value.trim();if(!name)return alert('請填行程名稱');save('trip',{day:Number($('tDay').value),time:$('tTime').value.trim(),name,place:$('tPlace').value.trim(),note:$('tNote').value.trim()})};$('saveShop').onclick=()=>{let name=$('sName').value.trim();if(!name)return alert('請填商品名稱');save('shop',{name,store:$('sStore').value,price:Number($('sPrice').value)||0,note:$('sNote').value.trim(),bought:records.shop.find(x=>x.id===editing.shop)?.bought||false})};$('saveCost').onclick=()=>{let name=$('cName').value.trim();if(!name)return alert('請填花費項目');save('cost',{name,amount:Number($('cAmount').value)||0,split:Number($('cSplit').value),payer:$('cPayer').value.trim(),day:Number($('cDay').value),note:$('cNote').value.trim()})};document.body.addEventListener('click',async e=>{let b=e.target.closest('[data-edit],[data-del],[data-toggle]');if(!b)return;if(b.dataset.edit){let [k,id]=b.dataset.edit.split(':');openForm(k,id)}if(b.dataset.del){let [k,id]=b.dataset.del.split(':');remove(k,id)}if(b.dataset.toggle){let r=records.shop.find(x=>x.id===b.dataset.toggle);if(r)try{await updateDoc(doc(db,'seoul2026_shop',r.id),{bought:!r.bought})}catch(e){alert(e.message)}}});
$('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){await signInWithRedirect(auth,provider)}else alert('登入失敗：'+e.message)}};$('logout').onclick=()=>signOut(auth);getRedirectResult(auth).catch(e=>showStatus('登入返回失敗：'+e.message));onAuthStateChanged(auth,u=>{unsubs.forEach(fn=>fn());unsubs=[];user=u;$('login').classList.toggle('hide',!!u);$('logout').classList.toggle('hide',!u);$('user').textContent=u?.email||'尚未登入';if(!u){records={trip:[],shop:[],cost:[]};showStatus('請先使用 Google 登入。未授權帳號無法讀取共用資料。');render();return}showStatus('正在連線共用資料庫…');let ready=0;['trip','shop','cost'].forEach(k=>{unsubs.push(onSnapshot(collection(db,'seoul2026_'+k),snapshot=>{records[k]=snapshot.docs.map(d=>({id:d.id,...d.data()}));ready++;if(ready>=3)showStatus('已連線，資料會即時同步到所有授權旅伴。',true);render()},e=>{showStatus('無法讀取資料：'+e.message+'。請確認 Firestore 規則已加入這個 Google 帳號。');render()}))})});render();
</script></body></html>
